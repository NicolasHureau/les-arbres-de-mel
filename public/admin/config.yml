backend:
  name: git-gateway
  branch: main

locale: fr

media_folder: "public/images/creations"
public_folder: "/images/creations"

collections:
  - name: "creations"
    label: "Créations"
    label_singular: "Création"

    folder: "src/data/creations"

    create: true
    delete: true

    slug: "{{slug}}"

    extension: "json"
    format: "json"

    fields:
      - label: "Slug"
        name: "slug"
        widget: "string"

      - label: "Titre"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Prix"
        name: "price"
        widget: "number"
        value_type: "float"
        min: 0

      - label: "Statut"
        name: "status"
        widget: "select"
        options:
          - label: "Disponible"
            value: "available"
          - label: "Vendu"
            value: "sold"

      - label: "Commandable"
        name: "canOrder"
        widget: "boolean"
        default: true

      - label: "Mise en avant"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Photos"
        name: "images"
        widget: "list"
        field:
          label: "Photo"
          name: "image"
          widget: "image"

      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - label: "Arbres"
            value: "arbres"

          - label: "Bijoux"
            value: "bijoux"

          - label: "Jardins"
            value: "jardins"

          - label: "Autres"
            value: "autres"

  - name: "site"
    label: "Informations du site"

    files:
      - label: "Configuration"
        name: "site"
        file: "src/data/site.json"

        fields:

          - label: "Nom du site"
            name: "name"
            widget: "string"

          - label: "Logo"
            name: "logo"
            widget: "image"
            required: false

          - label: "Slogan"
            name: "tagline"
            widget: "string"

          - label: "Description"
            name: "description"
            widget: "markdown"

          - label: "Email"
            name: "email"
            widget: "string"

          - label: "Ville"
            name: "location"
            widget: "string"

          # -------------------------
          # ARTISTE
          # -------------------------

          - label: "Présentation de l'artiste"
            name: "about"
            widget: "object"

            fields:

              - label: "Titre"
                name: "title"
                widget: "string"
                default: "L'artiste"

              - label: "Présentation"
                name: "text"
                widget: "markdown"

              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false

          # -------------------------
          # ATELIER
          # -------------------------

          - label: "Atelier"
            name: "workshop"
            widget: "object"

            fields:

              - label: "Titre"
                name: "title"
                widget: "string"
                default: "Mon atelier"

              - label: "Présentation"
                name: "text"
                widget: "markdown"

              - label: "Photos"
                name: "images"
                widget: "list"

                field:
                  label: "Photo"
                  name: "image"
                  widget: "image"

          # -------------------------
          # RÉSEAUX SOCIAUX
          # -------------------------

          - label: "Réseaux sociaux"
            name: "socials"
            widget: "object"

            fields:

              - label: "Instagram"
                name: "instagram"
                widget: "string"
                required: false

              - label: "Facebook"
                name: "facebook"
                widget: "string"
                required: false

          # -------------------------
          # PARTENAIRES
          # -------------------------

          - label: "Partenaires"
            name: "partners"
            widget: "list"

            summary: "{{fields.name}}"

            fields:

              - label: "Nom"
                name: "name"
                widget: "string"

              - label: "Site internet"
                name: "url"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false